[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kgcss"
description = "Fast and comprehensive CSS handling: tokenizing, parsing, a mutable object model, serialization and selector matching, with a C99 backend"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "Kovid Goyal", email = "kovid@kovidgoyal.net" }]
requires-python = ">=3.14"
dynamic = ["version"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: C",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Free Threading :: 2 - Beta",
    "Topic :: Text Processing :: Markup",
    "Typing :: Typed",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-xdist>=3.5",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.uv]
# Rebuild the extension when any of these change, not just pyproject.toml
cache-keys = [
    { file = "pyproject.toml" },
    { file = "setup.py" },
    { file = "csrc/*.c" },
    { file = "csrc/*.h" },
    { file = "src/kgcss/**/*.py" },
    { file = "src/kgcss/**/*.pyi" },
]

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["kgcss"]
include-package-data = true

[tool.setuptools.package-data]
kgcss = ["py.typed", "*.pyi"]

[tool.setuptools.dynamic]
version = { attr = "kgcss._version.__version__" }

# ---------------------------------------------------------------------------
# pytest. Run in parallel with: pytest -n auto
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
xfail_strict = true
filterwarnings = ["error"]
markers = [
    "slow: tests that take a long time to run (deselect with -m 'not slow')",
]

# ---------------------------------------------------------------------------
# ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 120
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "ANN",  # flake8-annotations: everything must be type annotated
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "PIE",  # flake8-pie
    "PT",   # flake8-pytest-style
    "PYI",  # flake8-pyi (stub files)
    "RUF",  # ruff specific
    "SIM",  # flake8-simplify
    "UP",   # pyupgrade
    "W",    # pycodestyle warnings
]
ignore = []

[tool.ruff.lint.flake8-annotations]
mypy-init-return = false
suppress-none-returning = false
allow-star-arg-any = false

[tool.ruff.format]
quote-style = "single"

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.14"
strict = true
files = ["src", "tests"]
mypy_path = "src"
warn_unreachable = true
