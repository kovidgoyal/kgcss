# Builds the sdist and the wheels, and uploads them to PyPI with Trusted Publishing when a v* tag is
# pushed (publish.py does that). Run it by hand (workflow_dispatch) to try the build without
# uploading. The wheels are configured in [tool.cibuildwheel] in pyproject.toml.
#
# PyPI must list this workflow as a trusted publisher of kgcss: repository kovidgoyal/kgcss,
# workflow release.yml, environment pypi. Restrict the pypi environment in the GitHub settings to
# v* tags.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheels:
    name: Wheels for ${{ matrix.os }}
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux-x86_64
            runs-on: ubuntu-latest
          - os: linux-aarch64
            runs-on: ubuntu-24.04-arm
          - os: macos-x86_64
            # The last x86_64 macOS runner
            runs-on: macos-15-intel
          - os: macos-arm64
            runs-on: macos-latest
          - os: windows-amd64
            runs-on: windows-latest
          - os: windows-arm64
            runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pypa/cibuildwheel@v4.3.5
      - uses: actions/upload-artifact@v4
        with:
          name: dist-wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
      - run: uv build --sdist --out-dir dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    needs: [wheels, sdist]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/kgcss/
    permissions:
      id-token: write  # Trusted Publishing, the only permission the upload needs
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Check that the files are kgcss and match the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          ls -l dist
          test -f "dist/kgcss-$version.tar.gz" || { echo "::error::No sdist for version $version"; exit 1; }
          for f in dist/*; do
            case "$(basename "$f")" in
              "kgcss-$version.tar.gz" | "kgcss-$version-"*.whl) ;;
              *) echo "::error::$f is not a kgcss $version file"; exit 1 ;;
            esac
          done
      - uses: pypa/gh-action-pypi-publish@release/v1
